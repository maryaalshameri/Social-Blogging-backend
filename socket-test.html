<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io Test Client - Social Blogging Platform</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .status {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .log {
            background: #2d3748;
            color: #a0aec0;
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        
        .log-entry.success {
            border-left-color: #48bb78;
            color: #9ae6b4;
        }
        
        .log-entry.error {
            border-left-color: #f56565;
            color: #fc8181;
        }
        
        .timestamp {
            color: #718096;
            font-size: 11px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 Socket.io Test Client</h1>
            <p>Real-time Connection Testing for Social Blogging Platform</p>
        </div>
        
        <div class="content">
            <div id="status" class="status disconnected">
                ⚫ Disconnected
            </div>
            
            <div class="section">
                <h2>📡 Server Connection</h2>
                <input type="text" id="serverUrl" value="http://localhost:5000" placeholder="Server URL">
                <button onclick="connectToServer()">Connect</button>
                <button onclick="disconnectFromServer()">Disconnect</button>
            </div>
            
            <div class="section">
                <h2>🏠 Join/Leave Post Room</h2>
                <input type="text" id="postId" placeholder="Enter Post ID">
                <button onclick="joinPost()">Join Post</button>
                <button onclick="leavePost()">Leave Post</button>
            </div>
            
            <div class="section">
                <h2>⌨️ Simulate User Typing</h2>
                <input type="text" id="username" placeholder="Your username">
                <button onclick="sendTyping(true)">Start Typing</button>
                <button onclick="sendTyping(false)">Stop Typing</button>
            </div>
            
            <div class="section">
                <h2>📝 Event Log</h2>
                <button onclick="clearLog()">Clear Log</button>
                <div id="eventLog" class="log">
                    <div class="log-entry">Waiting for connection...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('eventLog');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = '🟢 Connected';
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '⚫ Disconnected';
            }
        }
        
        function connectToServer() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            if (socket && socket.connected) {
                log('Already connected!', 'error');
                return;
            }
            
            log(`Connecting to ${serverUrl}...`);
            
            socket = io(serverUrl, {
                transports: ['websocket', 'polling']
            });
            
            socket.on('connect', () => {
                log(`✅ Connected! Socket ID: ${socket.id}`, 'success');
                updateStatus(true);
            });
            
            socket.on('disconnect', () => {
                log('❌ Disconnected from server', 'error');
                updateStatus(false);
            });
            
            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
                updateStatus(false);
            });
            
            // Listen for server events
            socket.on('newPost', (post) => {
                log(`📬 NEW POST: "${post.title}" by ${post.author.username}`, 'success');
            });
            
            socket.on('newComment', ({ comment, postId }) => {
                log(`💬 NEW COMMENT on post ${postId}: "${comment.content}"`, 'success');
            });
            
            socket.on('newLike', ({ type, targetId, userId, reactionType }) => {
                log(`❤️ NEW ${reactionType.toUpperCase()} on ${type}: ${targetId}`, 'success');
            });
            
            socket.on('userTyping', ({ username, isTyping }) => {
                const action = isTyping ? 'started typing' : 'stopped typing';
                log(`⌨️ ${username} ${action}`);
            });
        }
        
        function disconnectFromServer() {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('Disconnected manually');
                updateStatus(false);
            } else {
                log('Not connected!', 'error');
            }
        }
        
        function joinPost() {
            const postId = document.getElementById('postId').value;
            
            if (!socket || !socket.connected) {
                log('Not connected to server!', 'error');
                return;
            }
            
            if (!postId) {
                log('Please enter a Post ID!', 'error');
                return;
            }
            
            socket.emit('joinPost', postId);
            log(`🏠 Joined post room: ${postId}`, 'success');
        }
        
        function leavePost() {
            const postId = document.getElementById('postId').value;
            
            if (!socket || !socket.connected) {
                log('Not connected to server!', 'error');
                return;
            }
            
            if (!postId) {
                log('Please enter a Post ID!', 'error');
                return;
            }
            
            socket.emit('leavePost', postId);
            log(`🚪 Left post room: ${postId}`, 'success');
        }
        
        function sendTyping(isTyping) {
            const postId = document.getElementById('postId').value;
            const username = document.getElementById('username').value;
            
            if (!socket || !socket.connected) {
                log('Not connected to server!', 'error');
                return;
            }
            
            if (!postId || !username) {
                log('Please enter both Post ID and Username!', 'error');
                return;
            }
            
            socket.emit('userTyping', {
                postId,
                username,
                isTyping
            });
            
            const action = isTyping ? 'started' : 'stopped';
            log(`⌨️ Sent typing ${action} event`, 'success');
        }
        
        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            log('Log cleared');
        }
        
        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('Socket.io Test Client loaded');
            log('Click "Connect" to establish connection');
        });
    </script>
</body>
</html>
